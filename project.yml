name: NeuroCalm
options:
  bundleIdPrefix: com.alokic.app.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

targets:
  NeuroCalm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NeuroCalm
        excludes:
          - "**/.DS_Store"
    info:
      path: NeuroCalm/Info.plist
      properties:
        CFBundleDisplayName: NeuroCalm
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCalendarsUsageDescription: "NeuroCalm shows your upcoming calendar events in the Planner so your schoolwork and events are in one place."
        NSCalendarsFullAccessUsageDescription: "NeuroCalm shows your upcoming calendar events in the Planner so your schoolwork and events are in one place."
        NSHealthShareUsageDescription: "NeuroCalm reads your mindfulness data so it can show how often you've been calming your mind."
        NSHealthUpdateUsageDescription: "NeuroCalm saves your breathing sessions to the Health app as Mindful Minutes."
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.1035797222908-mn3305j8ou71s67dm16io9ehgqffnie2
        # Let the Progress share sheet detect these apps so it can hand off
        # directly (e.g. Instagram Stories) when they're installed.
        LSApplicationQueriesSchemes:
          - instagram-stories
          - instagram
          - whatsapp
          - snapchat
          - tiktok
          - fb
          - twitter
    entitlements:
      path: NeuroCalm/NeuroCalm.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alokic.app.ios.NeuroCalm
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 88944EY694
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn

  NeuroCalmTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NeuroCalmTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alokic.app.ios.NeuroCalmTests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 88944EY694
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NeuroCalm

  NeuroCalmUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NeuroCalmUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alokic.app.ios.NeuroCalmUITests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 88944EY694
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NeuroCalm
    dependencies:
      - target: NeuroCalm

schemes:
  NeuroCalm:
    build:
      targets:
        NeuroCalm: all
        NeuroCalmTests: [test]
        NeuroCalmUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeuroCalmTests
        - NeuroCalmUITests
    archive:
      config: Release
